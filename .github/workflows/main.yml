name: Build TurboController

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore TurboController/TurboController.csproj

      - name: Build
        run: dotnet build TurboController/TurboController.csproj --configuration Release --no-restore
